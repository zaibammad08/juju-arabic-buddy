name: juju_arabic_buddy
description: Arabic Buddy – learn Arabic at home with Juju the camel.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1        # Baloo 2 (English) + Baloo Bhaijaan 2 (Arabic)
  flutter_animate: ^4.5.0     # Juju bounce / wiggle
  audioplayers: ^6.1.0        # pre-made audio + cached TTS
  http: ^1.2.2                # Meta Model API, Azure TTS
  shared_preferences: ^2.3.2  # progress
  path_provider: ^2.1.4       # TTS + story picture cache, writing wall
  crypto: ^3.0.5              # cache file names

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Every folder listed must exist, or the build fails. Flutter does NOT include
  # sub-folders automatically: list each assets/audio/<folder>/ you copy in.
  assets:
    - assets/data/
    - assets/images/
    - assets/mascot/camel_wave.webp
    - assets/mascot/
    - assets/data/lessons/lesson_words.json
    - assets/data/lesson_words.json
    - assets/data/arabic_cache.json
    - assets/data/page_words.json
    - assets/data/colours.json
    - assets/data/sentence_bank.json
    - assets/data/adjectives.json
    - assets/data/sentence_templates.json
    # - assets/places/
    # - assets/audio/<folder>/
